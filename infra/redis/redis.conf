# Redis configuration for FraudGuard feature store
# Optimized for low-latency feature reads (p50 target: <1ms)

# ── Network ────────────────────────────────────────────
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── Memory ─────────────────────────────────────────────
# Feature store: rolling window features per account.
# At 5k TPS with 10k distinct accounts, expect ~10k keys × ~500 bytes = ~5MB active.
# Set maxmemory conservatively; evict LRU when full.
# In production, size based on actual distinct account count × feature size.
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence ─────────────────────────────────────────
# Redis is a CACHE of derived state (Flink is the source of truth).
# Persistence is optional but useful for faster warm-up after restarts.
# Save every 900s if ≥1 key changed, every 300s if ≥10 keys, every 60s if ≥10000 keys
save 900 1
save 300 10
save 60 10000

appendonly no

# ── Performance ─────────────────────────────────────────
hz 20
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ── Slow log ────────────────────────────────────────────
# Log commands taking longer than 1ms (1000 microseconds)
slowlog-log-slower-than 1000
slowlog-max-len 128

# ── Latency monitoring ──────────────────────────────────
latency-monitor-threshold 50
latency-tracking yes

# ── Keyspace notifications ──────────────────────────────
# Disabled (no subscribers in this setup). Enable if needed for cache invalidation.
notify-keyspace-events ""

# ── Logging ─────────────────────────────────────────────
loglevel notice
