global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-stdout'
  routes:
    - match:
        severity: critical
      receiver: 'webhook-stdout'
      repeat_interval: 1h

receivers:
  - name: 'webhook-stdout'
    webhook_configs:
      - url: 'http://webhook-receiver:5001/alert'
        send_resolved: true
        http_config: {}
        max_alerts: 10

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
