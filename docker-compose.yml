# =============================================================
# RealTimeFraudGuard — docker-compose.yml
#
# Full local integration stack. Intended for pre-K8s testing.
# Start infrastructure only: docker compose up redpanda postgres redis minio
# Start full stack:          docker compose up
#
# Service health checks use 'condition: service_healthy' to
# enforce strict startup ordering. No service starts until its
# dependency is confirmed ready — this prevents race conditions.
# =============================================================

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SCHEMA_REGISTRY_URL: http://redpanda:8081
  TRANSACTIONS_TOPIC: transactions
  FLAGGED_EVENTS_TOPIC: flagged-events
  FLAGGED_EVENTS_DLQ_TOPIC: flagged-events-dlq

services:

  # ── Redpanda (Kafka-compatible broker) ─────────────────────
  # Chosen over Kafka for local dev: single binary, no ZooKeeper,
  # built-in schema registry, significantly faster startup.
  # API-compatible with all Confluent/Kafka clients.
  redpanda:
    image: redpandadata/redpanda:v23.3.9
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --set
      - redpanda.auto_create_topics_enabled=false
      - --set
      - schema_registry.schema_registry_api=[{"address":"0.0.0.0","port":8081}]
    ports:
      - "18081:18081"  # Schema Registry (external access for debugging)
      - "19092:19092"  # Kafka (external access for local clients)
      - "9644:9644"    # Admin API + Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - fraudguard

  # ── Topic initialization ────────────────────────────────────
  # Runs once to create all required topics with correct
  # partition counts. 24 partitions for transactions = allows
  # up to 24 parallel Flink/scoring-service consumer instances.
  createtopics:
    image: redpandadata/redpanda:v23.3.9
    container_name: createtopics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        rpk topic create transactions \
          --partitions 24 \
          --replicas 1 \
          --topic-config retention.ms=86400000 \
          --topic-config max.message.bytes=1048576 \
          -X brokers=redpanda:9092 && echo "✓ transactions"

        rpk topic create flagged-events \
          --partitions 8 \
          --replicas 1 \
          --topic-config retention.ms=604800000 \
          -X brokers=redpanda:9092 && echo "✓ flagged-events"

        rpk topic create flagged-events-dlq \
          --partitions 4 \
          --replicas 1 \
          --topic-config retention.ms=2592000000 \
          -X brokers=redpanda:9092 && echo "✓ flagged-events-dlq"

        echo "All topics created."
    networks:
      - fraudguard
    restart: on-failure

  # ── Redpanda Console ────────────────────────────────────────
  # Web UI: browse topics, messages, schemas, consumer group lag.
  # Access at http://localhost:8080
  redpanda-console:
    image: redpandadata/console:v2.4.3
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./infra/kafka/console-config.yaml:/etc/redpanda/redpanda-console-config.yaml:ro
    environment:
      CONFIG_FILEPATH: /etc/redpanda/redpanda-console-config.yaml
    networks:
      - fraudguard

  # ── PostgreSQL ──────────────────────────────────────────────
  # Audit store for decisions, feature snapshots, LLM notes,
  # analyst resolutions. PostgreSQL chosen for ACID guarantees
  # on decision records and structured dashboard queries.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: fraudguard
      POSTGRES_USER: ${POSTGRES_USER:-fraudguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudguard_secret}
      # Tune for write-heavy workload
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c wal_level=minimal
      -c max_wal_senders=0
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_cache_size=768MB
      -c log_min_duration_statement=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudguard} -d fraudguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraudguard

  # ── Redis ───────────────────────────────────────────────────
  # Feature store: latest sliding-window features per account_id.
  # Read by scoring service on every /score request.
  # Redis is a CACHE of derived state; Flink checkpoints are
  # the source of truth for window state.
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraudguard

  # ── MinIO ───────────────────────────────────────────────────
  # S3-compatible object store for Flink checkpoint state.
  # Flink checkpoints every 30s to s3://flink-checkpoints/
  # so the job can be restarted from the latest checkpoint
  # without losing sliding window state.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - fraudguard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ── MinIO bucket initialization ─────────────────────────────
  minio-createbuckets:
    image: minio/mc:latest
    container_name: minio-createbuckets
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb --ignore-existing local/flink-checkpoints;
      /usr/bin/mc mb --ignore-existing local/flink-savepoints;
      echo 'MinIO buckets ready';
      "
    networks:
      - fraudguard

  # ── Flink JobManager ─────────────────────────────────────────
  # Session cluster: JobManager coordinates task scheduling.
  # In production: use Flink Application Mode on K8s (one cluster per job).
  flink-jobmanager:
    image: fraudguard/flink-processor:latest
    build:
      context: ./flink-processor
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    command: jobmanager
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8081:8081"  # Flink Web UI
    environment:
      <<: *common-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/checkpoints
        state.savepoints.dir: s3://flink-savepoints/savepoints
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 60000
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: ${MINIO_ROOT_USER:-minioadmin}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-minioadmin123}
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./flink-processor:/opt/flink/usrlib/job:ro
    networks:
      - fraudguard
    profiles:
      - flink  # Only started with: docker compose --profile flink up

  # ── Flink TaskManager ────────────────────────────────────────
  flink-taskmanager:
    image: fraudguard/flink-processor:latest
    build:
      context: ./flink-processor
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      <<: *common-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.checkpoints.dir: s3://flink-checkpoints/checkpoints
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: ${MINIO_ROOT_USER:-minioadmin}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-minioadmin123}
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      REDIS_URL: redis://redis:6379/0
    networks:
      - fraudguard
    profiles:
      - flink

  # ── Scoring Service ──────────────────────────────────────────
  scoring-service:
    image: fraudguard/scoring-service:latest
    build:
      context: ./scoring-service
      dockerfile: Dockerfile
    container_name: scoring-service
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"   # FastAPI
      - "8002:8002"   # Prometheus metrics
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://fraudguard:${POSTGRES_PASSWORD:-fraudguard_secret}@postgres:5432/fraudguard
      REDIS_URL: redis://redis:6379/0
      SCORING_SERVICE_PORT: 8000
      THRESHOLD_FLAG: ${THRESHOLD_FLAG:-0.30}
      THRESHOLD_BLOCK: ${THRESHOLD_BLOCK:-0.70}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: scoring-service
    networks:
      - fraudguard
    profiles:
      - app

  # ── LLM Worker ───────────────────────────────────────────────
  llm-worker:
    image: fraudguard/llm-worker:latest
    build:
      context: ./llm-worker
      dockerfile: Dockerfile
    container_name: llm-worker
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"   # Prometheus metrics
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://fraudguard:${POSTGRES_PASSWORD:-fraudguard_secret}@postgres:5432/fraudguard
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama3-70b-8192}
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
      OTEL_SERVICE_NAME: llm-worker
    networks:
      - fraudguard
    profiles:
      - app

  # ── Transaction Producer ─────────────────────────────────────
  producer:
    image: fraudguard/producer:latest
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: producer
    depends_on:
      createtopics:
        condition: service_completed_successfully
    ports:
      - "8001:8001"   # Prometheus metrics
    environment:
      <<: *common-env
      PRODUCER_TPS: ${PRODUCER_TPS:-100}
      FRAUD_RATE: ${FRAUD_RATE:-0.02}
    networks:
      - fraudguard
    profiles:
      - app

  # ── Analyst Dashboard (React) ─────────────────────────────────
  analyst-dashboard:
    image: fraudguard/analyst-dashboard:latest
    build:
      context: ./analyst-dashboard
      dockerfile: Dockerfile
    container_name: analyst-dashboard
    depends_on:
      - scoring-service
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks:
      - fraudguard
    profiles:
      - app

  # ── Webhook Receiver (local Slack stub) ──────────────────────
  # Receives Alertmanager webhooks and logs them to stdout.
  # Replaces a real Slack webhook for local testing.
  # Alerts are real — this just outputs them instead of posting to Slack.
  webhook-receiver:
    image: fraudguard/webhook-receiver:latest
    build:
      context: ./webhook-receiver
      dockerfile: Dockerfile
    container_name: webhook-receiver
    ports:
      - "5001:5001"
    networks:
      - fraudguard
    profiles:
      - observability

# ── Named volumes ──────────────────────────────────────────────
volumes:
  redpanda-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

# ── Network ─────────────────────────────────────────────────────
networks:
  fraudguard:
    driver: bridge
    name: fraudguard
